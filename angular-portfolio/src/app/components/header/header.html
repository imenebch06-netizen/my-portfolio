<mat-toolbar class="navbar">
  <div class="container header-inner">
    <a routerLink="/" class="logo">IB<span class="text-mauve">.</span></a>
    
    <!-- Desktop Nav -->
    <div class="desktop-nav">
      <button 
        mat-button 
        *ngFor="let item of navItems" 
        (click)="scrollTo(item.target)">
        {{ item.label }}
      </button>
      <a mat-flat-button color="primary" href="https://github.com/your-username" target="_blank">
        <mat-icon>code</mat-icon> GitHub
      </a>
    </div>

    <!-- Mobile Nav with mat-menu -->
    <div class="mobile-nav">
      <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Toggle navigation menu">
        <mat-icon>menu</mat-icon>
      </button>
      
      <mat-menu #menu="matMenu" xPosition="before">
        <button 
          mat-menu-item 
          *ngFor="let item of navItems" 
          (pointerdown)="scrollTo(item.target)">
          <span>{{ item.label }}</span>
        </button>
        <a mat-menu-item href="https://github.com/imenebch06-netizen" target="_blank">
          <mat-icon>code</mat-icon>
          <span>GitHub</span>
        </a>
      </mat-menu>
    </div>
  </div>
</mat-toolbar>

<section id="projects">
  <div class="container">
    <div class="section-header">
      <h2>Featured <span class="text-mauve">Projects</span></h2>
      <p>Real-world applications I've built and deployed.</p>
    </div>

    <div class="projects-grid">
      <mat-card *ngFor="let project of projects" class="project-card" appearance="outlined">
        <mat-card-header>
          <mat-icon mat-card-avatar color="primary">{{ project.icon }}</mat-icon>
          <mat-card-title>{{ project.title }}</mat-card-title>
        </mat-card-header>
        
        <mat-card-content>
          <p class="project-desc">{{ project.description }}</p>
          <mat-chip-set aria-label="Tech Stack">
            <mat-chip *ngFor="let tech of project.tech">{{ tech }}</mat-chip>
          </mat-chip-set>
        </mat-card-content>
        
        <mat-card-actions>
         <a mat-stroked-button color="accent" [href]="project.link" target="_blank">
  <mat-icon>code</mat-icon> View GitHub source
</a>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
</section>
